name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build package
        run: swift build
      - name: Smoke-run version command
        run: ./.build/debug/FluidTranscriptionCLI version
      - name: Build release binary
        run: swift build -c release
      - name: Stage release layout
        run: |
          mkdir -p release/bin
          cp .build/release/FluidTranscriptionCLI release/bin/ft
          chmod +x release/bin/ft
          ln -sf ft release/bin/fluid-transcription
      - name: Build installer package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          mkdir -p pkgroot/usr/local/bin
          cp release/bin/ft pkgroot/usr/local/bin/ft
          chmod 755 pkgroot/usr/local/bin/ft
          ln -sf ft pkgroot/usr/local/bin/fluid-transcription
          pkgbuild \
            --root pkgroot \
            --identifier com.alvaroum.fluid-transcription \
            --version "$VERSION" \
            --install-location / \
            "release/fluid-transcription-${VERSION}-macos-${ARCH}.pkg"
      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          tar -czf "release/fluid-transcription-${VERSION}-macos-${ARCH}.tar.gz" -C release bin
      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 ./*.pkg ./*.tar.gz > SHA256SUMS
      - name: Capture release metadata
        id: release-metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          TARBALL="fluid-transcription-${VERSION}-macos-${ARCH}.tar.gz"
          SHA256="$(shasum -a 256 "release/${TARBALL}" | awk '{print $1}')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
      - name: Generate Homebrew formula
        run: |
          ./scripts/render-homebrew-formula.sh \
            "${{ steps.release-metadata.outputs.version }}" \
            "${{ steps.release-metadata.outputs.sha256 }}" \
            > release/fluid-transcription.rb
      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          ./scripts/update-homebrew-tap.sh \
            "${{ steps.release-metadata.outputs.version }}" \
            "${{ steps.release-metadata.outputs.sha256 }}" \
            alvaroum/homebrew-fluid-transcription
      - name: Generate release notes
        run: ./scripts/generate-release-notes.sh "$GITHUB_REF_NAME" release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/*.pkg
            release/*.tar.gz
            release/fluid-transcription.rb
            release/SHA256SUMS